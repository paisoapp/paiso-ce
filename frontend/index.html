<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The logo is supplied as raster artwork, so the favicon is a PNG. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d3d21" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme fonts are bundled with the app: see src/fonts.css. -->

    <title>Paiso</title>

    <!-- Applies the saved theme before first paint. A file, not an inline
         block, so the Content-Security-Policy needs no 'unsafe-inline'. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Refuses a pull request that adds a dependency with a known High or Critical
# advisory. Needs the dependency graph, which GitHub provides for public
# repositories, so it is skipped while the repository is private.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

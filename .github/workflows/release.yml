# A release is a vX.Y.Z tag on main. The image is built and tested from the
# tag; it is published only after a maintainer approves the `release`
# environment.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/paisoapp/paiso

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r backend/requirements.lock
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: paiso:release
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
      - name: Smoke suite
        run: IMAGE=paiso:release scripts/smoke.sh
      - name: Upgrade test from the latest release
        run: |
          if docker pull "$IMAGE:latest" >/dev/null 2>&1; then
            OLD_IMAGE="$IMAGE:latest" NEW_IMAGE=paiso:release scripts/upgrade-test.sh
          else
            echo "No earlier release to upgrade from."
          fi

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write       # the GitHub Release
      packages: write       # ghcr.io
      id-token: write       # keyless cosign signing
      attestations: write   # build provenance
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # X.Y.Z and X.Y; latest only for a release that is not a
          # pre-release (metadata-action skips it for v0.2.0-rc.1).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Release notes
        run: |
          version="${{ steps.v.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "Image: \`$IMAGE:$version\`"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" docker-compose.yml \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${flags[@]}"

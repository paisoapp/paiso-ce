# Contributor License Agreement check (CLA.md), with CLA Assistant Lite.
#
# A contributor signs by commenting the sentence below on their pull request.
# Signatures are kept in the `signatures` branch of this repository; no
# outside service holds them. The action does not check out the pull
# request's code, so running it on pull_request_target is safe.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target'
      || github.event.comment.body == 'recheck'
      || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/paisoapp/paiso-ce/blob/main/CLA.md
          branch: signatures
          allowlist: ahmadfs,dependabot[bot]

# Alembic configuration. The database URL is NOT set here — env.py derives it
# from app.core.config.settings (PAISO_SQLITE_PATH) so migrations always target
# the same database the app uses.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Template for new revision files: 0002_add_widget_table.py etc.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
